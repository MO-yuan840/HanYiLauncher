apply plugin: 'com.android.application'

android {
    buildFeatures { buildConfig true }

    namespace 'net.hanyi.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "net.hanyi.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0-alpha"

        // 只出 arm64-v8a：手机启动器主战场；要 32 位再加 abiFilters
        ndk {
            abiFilters 'arm64-v8a'
        }

        // 把版本清单缓存策略交给 Java 层
        buildConfigField "String", "CF_API_KEY", '"PLACEHOLDER"' // 填 CurseForge API Key，留空则自动跳过该源
        buildConfigField "String", "META_URL",
                '"https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"'
        buildConfigField "String", "ASSET_HOST",
                '"https://resources.download.minecraft.net/"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 关键：JRE 的 .so（libjvm.so / libjava.so / libjli.so …）放这里才会进 APK 并被 System.loadLibrary 找到
    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
        assets.srcDirs   = ['src/main/assets']
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true   // 让 Dalvik 能加载解压出的 JVM .so
        }
        resources {
            excludes += ['META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.4'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.4'
}
